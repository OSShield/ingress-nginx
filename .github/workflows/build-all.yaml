name: Build and publish images and chart

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CONTROLLER_IMAGE: &controller_image cr.osshield.eu/nginx/controller
  PROXY_IMAGE: &proxy_image cr.osshield.eu/nginx/proxy
  IMAGE_TAG: latest
  IMAGE_VERSION_TAG: &version v1.15.15

jobs:
  amd64:
    uses: ./.github/workflows/build-amd64.yaml
    with: &build_inputs
      controller_image: *controller_image
      proxy_image: *proxy_image
      version: *version

  arm64:
    uses: ./.github/workflows/build-arm64.yaml
    with: *build_inputs

  publish:
    name: Publish multi-platform image tags
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    outputs:
      controller_digest: ${{ steps.manifests.outputs.controller_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.34.0

      - uses: scheiblingco/redskap-actions/docker-login@v2
        with:
          instance: https://pkg.osshield.eu
          vhost: cr.osshield.eu

      - name: Combine amd64 and arm64 manifests
        id: manifests
        env:
          AMD64_PROXY: ${{ needs.amd64.outputs.proxy_digest }}
          ARM64_PROXY: ${{ needs.arm64.outputs.proxy_digest }}
          AMD64_CONTROLLER: ${{ needs.amd64.outputs.controller_digest }}
          ARM64_CONTROLLER: ${{ needs.arm64.outputs.controller_digest }}
        run: |
          docker buildx imagetools create \
            --tag "${PROXY_IMAGE}:${IMAGE_TAG}" \
            --tag "${PROXY_IMAGE}:${IMAGE_VERSION_TAG}" \
            "${PROXY_IMAGE}@${AMD64_PROXY}" "${PROXY_IMAGE}@${ARM64_PROXY}"

          docker buildx imagetools create \
            --tag "${CONTROLLER_IMAGE}:${IMAGE_TAG}" \
            --tag "${CONTROLLER_IMAGE}:${IMAGE_VERSION_TAG}" \
            --metadata-file controller-index.json \
            "${CONTROLLER_IMAGE}@${AMD64_CONTROLLER}" "${CONTROLLER_IMAGE}@${ARM64_CONTROLLER}"

          digest=$(jq -er '."containerimage.descriptor".digest' controller-index.json)
          printf 'controller_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  chart:
    name: Package and upload Helm chart
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.3

      - name: Point packaged chart at the published controller
        env:
          CONTROLLER_DIGEST: ${{ needs.publish.outputs.controller_digest }}
          IMAGE_VERSION_TAG: ${{ env.IMAGE_VERSION_TAG }}
        run: |
          # Modify only the runner's checkout; other chart images keep their defaults.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          values = Path('charts/ingress-nginx/values.yaml')
          registry, image = os.environ['CONTROLLER_IMAGE'].split('/', 1)
          print("Registry:", registry)
          print("Image:", image)
          print("Image Version Tag:", os.environ['IMAGE_VERSION_TAG'])
          overrides = {
              'registry': registry,
              'image': image,
              'tag': os.environ['IMAGE_VERSION_TAG'],
              'digest': os.environ['CONTROLLER_DIGEST'],
          }
          lines = values.read_text().splitlines(keepends=True)
          start = lines.index('  image:\n', lines.index('controller:\n'))
          for index in range(start + 1, len(lines)):
              line = lines[index]
              if line.strip() and not line.startswith(('    ', '#')):
                  break
              for key, value in overrides.items():
                  if line.startswith(f'    {key}:') or line.startswith(f'    # {key}:'):
                      lines[index] = f'    {key}: {json.dumps(value)}\n'
          values.write_text(''.join(lines))
          PY

      - name: Package Helm chart
        run: helm package charts/ingress-nginx --app-version "$IMAGE_VERSION_TAG" --destination dist

      - uses: scheiblingco/redskap-actions/upload@v2
        with:
          instance: https://pkg.osshield.eu
          vhost: helm.osshield.eu
          type: helm
          files: dist/*.tgz


      # Sample upload: replace with your chart registry or repository upload.
      - name: Upload Helm chart as a workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ingress-nginx-chart
          path: dist/*.tgz
          if-no-files-found: error
